# dsh-fff — bundle layer (npm install form).
# Install with: dsh plugin --profile <name> add dsh-fff
# The row references the package by name so Node resolution finds the
# installed code. Source checkout users mount it via the profile's own
# cordis.patch.yml with `name: ./plugins/dsh-fff/index.js` instead.
- insert:
    - id: dsh-fff
      name: dsh-fff
